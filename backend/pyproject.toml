[project]
name = "shape-param-lab-backend"
version = "0.1.0"
description = "CAD 形状の寸法をパラメータ化して変形・可視化し、サロゲート学習用の形状を一括生成するツール"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
    "python-multipart>=0.0.9",
    "cadquery-ocp>=7.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false
[tool.pytest.ini_options]
pythonpath = ["."]
